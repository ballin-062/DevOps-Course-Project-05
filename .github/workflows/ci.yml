name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      # Week 5: package the application after tests pass.
      # Steps run in order, so these only execute if pytest succeeded.
      - name: Create package directory
        run: |
          mkdir -p dist/package
          cp -r app requirements.txt README.md VERSION dist/package/

      - name: Create ZIP package
        run: |
          cd dist/package
          zip -r ../sdi4213-app.zip . -x "*/__pycache__/*" "*.pyc"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdi4213-app-${{ github.sha }}
          path: dist/sdi4213-app.zip
          if-no-files-found: error
          retention-days: 14
